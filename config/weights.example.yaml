# =============================================================================
#  PARAMETER TEMPLATE
# =============================================================================
#  This file shows the STRUCTURE of the scoring configuration. The actual
#  weights used in production are tuned and kept private, so every weight here
#  is set to a neutral placeholder.
#
#  To use this: copy to config/weights.yaml and set your own weights. The
#  engine normalizes the total to 100, so only the ratios between weights
#  matter, not their absolute size.
#
#    cp config/weights.example.yaml config/weights.yaml
#
#  Field reference:
#    weight     relative importance (any positive number)
#    direction  higher_better | lower_better
#    norm       rank  -> percentile within the scan (robust, scale-free)
#               band  -> absolute thresholds from the `bands` list
#               raw   -> the factor already emits 0-100
#    category   groups parameters for the dashboard and cluster budgets
# =============================================================================

meta:
  version: 3
  base_currency: USD
  auto_disable_coverage_below: 0.15
  min_coverage_for_confidence: 0.6
  min_coverage_to_include: 0.55
  coverage_shrink_power: 1.0
  sector_neutralize: true
  penalty_unit: sigma
  penalty_total_cap_sigma: 2.2

# =============================================================================
#  FACTORS
#  Every weight below is a placeholder. Set your own.
# =============================================================================
factors:

  - id: eps_revision_momentum
    name_tr: "Analist kar tahmini revizyonu (yukari/asagi)"
    category: analyst
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: rank
    source: "yahoo:eps_trend + eps_revisions"

  - id: trend_structure
    name_tr: "Teknik trend yapisi (Minervini trend sablonu)"
    category: technical
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: raw
    source: "computed"

  - id: valuation_composite
    name_tr: "Degerleme (ucuzluk) bilesigi — F/K, PD/DD, FD/FAVOK, P/S, FCF"
    category: valuation
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: rank
    source: "yahoo:info"

  - id: price_momentum_12_1
    name_tr: "Fiyat momentumu (12 ay, son ay haric)"
    category: momentum
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: rank
    source: "yahoo:history"

  - id: quality_profitability
    name_tr: "Kalite / karlilik (ROE, ROA, brut ve faaliyet marji)"
    category: quality
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: rank
    source: "yahoo:info"

  - id: technical_oscillators
    name_tr: "Teknik ozet: 30 sinyalli oy sayimi (MA + osilator + trend)"
    category: technical
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: raw
    source: "computed"

  - id: financial_health
    name_tr: "Finansal saglik (Piotroski F-Score, borc, nakit akisi)"
    category: quality
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: raw
