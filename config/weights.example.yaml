  - id: analyst_consensus
    name_tr: "Analist tavsiye seviyesi (Al / Guclu Al) — Investing.com muadili"
    category: analyst
    weight: 1.0                     # placeholder
    direction: lower_better
    norm: rank
    source: "yahoo:recommendationMean + numberOfAnalystOpinions"
    bands:
      - {max: 1.5, score: 100, label_tr: "Guclu Al"}
      - {max: 2.0, score: 82, label_tr: "Al"}
      - {max: 2.5, score: 62, label_tr: "Al (zayif)"}
      - {max: 3.0, score: 38, label_tr: "Tut"}
      - {max: 3.5, score: 18, label_tr: "Tut / Sat"}
      - {max: 5.1, score: 0, label_tr: "Sat"}

  - id: risk_drawdown
    name_tr: "Risk: volatilite, beta, maksimum dusus"
    category: risk
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: rank
    source: "yahoo:history + info"

  - id: liquidity
    name_tr: "Likidite (gunluk islem hacmi, piyasa degeri)"
    category: risk
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: rank
    source: "yahoo:info"

  - id: reddit_wsb_attention
    name_tr: "Reddit r/wallstreetbets ilgisi ve ivmesi"
    category: sentiment
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: raw
    source: "apewisdom + tradestie"

  - id: short_squeeze
    name_tr: "Aciga satis baskisi / squeeze potansiyeli"
    category: sentiment
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: rank
    source: "yahoo:info"

  - id: nominal_price_fit
    name_tr: "Nominal hisse fiyati uygunlugu (kullanici tercihi)"
    category: preference
    weight: 1.0                     # placeholder
    direction: higher_better
    norm: band
    source: "yahoo:info"
    bands:
      - {max: 1.0, score: 10, label_tr: "Penny (<1$) — cok riskli"}
      - {max: 5.0, score: 55, label_tr: "Cok dusuk (1-5$)"}
      - {max: 50.0, score: 100, label_tr: "Ideal (5-50$)"}
      - {max: 150.0, score: 85, label_tr: "Orta (50-150$)"}
      - {max: 400.0, score: 65, label_tr: "Yuksek (150-400$)"}
      - {max: 1e12, score: 45, label_tr: "Cok yuksek (>400$)"}

# =============================================================================
#  PENALTIES  (in units of standard deviation, so they stay proportional)
# =============================================================================
penalties:
  - id: negative_fcf_high_debt
    name_tr: "Negatif serbest nakit akisi + yuksek borc"
    sigma: -0.25                    # placeholder
  - id: hype_reversal_risk
    name_tr: "Asiri ilgi + asiri alim (RSI>75 ve WSB ilk 10)"
    sigma: -0.25                    # placeholder
  - id: parabolic_extension
    name_tr: "Parabolik asiri uzama (MA50 uzerinde >%40)"
    sigma: -0.25                    # placeholder
  - id: distribution_pattern
    name_tr: "Dagitim: fiyat yukselirken OBV dusuyor"
    sigma: -0.25                    # placeholder
  - id: earnings_imminent
    name_tr: "7 gun icinde bilanco"
    sigma: -0.25                    # placeholder

# =============================================================================
#  CORRELATION CLUSTERS
#  Parameters that measure the same thing share a weight budget, so their
#  effects don't stack into a hidden single bet.
# =============================================================================
clusters:
  - id: trend
    name_tr: "Trend / momentum kumesi"
    budget: 10.0                    # placeholder
    members:
      - trend_structure
      - stage2_breakout
      - momentum_persistence
      - chart_position
      - relative_strength
      - price_momentum_12_1

# =============================================================================
#  FILTERS  (deliberately loose - meant to drop junk, not to screen stocks)
# =============================================================================
filters:
  min_price: 1.0
  min_market_cap: 150000000
  max_market_cap: 20000000000
  min_avg_dollar_volume: 1000000
  max_price: null
  require_wsb: false
  require_analyst_buy: false
